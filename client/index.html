<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: enables safe-area-inset-* on notched devices (iOS + Android)
         interactive-widget=resizes-content: Android Chrome 108+ — keyboard shrinks the
         layout viewport instead of overlaying it, so fixed bottom CTAs stay visible -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OTB Chess" />
    <meta name="application-name" content="OTB Chess" />
    <meta name="theme-color" content="#3D6B47" />
    <meta name="msapplication-TileColor" content="#3D6B47" />
    <!-- Checkerboard OTB!! browser and install identity -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/otb-checker-favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/otb-checker-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/otb-checker-app-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/otb-checker-app-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/otb-checker-app-icon-180.png" />
    <meta name="msapplication-TileImage" content="/brand/otb-checker-app-icon-192.png" />
    <title>ChessOTB.club | Chess Tournaments &amp; Clubs Over the Board</title>
    <meta name="description" content="Host over-the-board chess tournaments, grow your chess club, and run leagues with smart pairings, live standings, player profiles, and easy QR check-in." />
    <meta name="keywords" content="chess tournaments, over-the-board chess, chess clubs, Swiss pairings, chess leagues, tournament management" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OTB Chess" />
    <meta property="og:title" content="ChessOTB.club | Chess Tournaments &amp; Clubs Over the Board" />
    <meta property="og:description" content="Host over-the-board chess tournaments, grow your chess club, and run leagues with smart pairings, live standings, player profiles, and easy QR check-in." />
    <meta property="og:image" content="https://chessotb.club/brand/otb-retro-og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://chessotb.club" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@otbchess" />
    <meta name="twitter:title" content="ChessOTB.club | Chess Tournaments &amp; Clubs Over the Board" />
    <meta name="twitter:description" content="Host over-the-board chess tournaments, grow your chess club, and run leagues with smart pairings, live standings, player profiles, and easy QR check-in." />
    <meta name="twitter:image" content="https://chessotb.club/brand/otb-retro-og-card.png" />

    <!-- Font preconnects — must come before the stylesheet links -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fontshare (Clash Display) — preconnect for faster DNS resolution -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />

    <!-- Inter from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

    <!-- Clash Display from CDN (Fontshare) -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
